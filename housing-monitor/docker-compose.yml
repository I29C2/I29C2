services:
  housing-monitor:
    build: .
    image: housing-monitor:latest
    container_name: housing-monitor
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Europe/Berlin
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./database:/app/database
      - ./logs:/app/logs
    # Uncomment if the optional dashboard is enabled in config.yaml
    # ports:
    #   - "8080:8080"
