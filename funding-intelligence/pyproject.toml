[project]
name = "funding-intelligence"
version = "0.1.0"
description = "TeamILabs Funding Intelligence — MVP"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Async jobs
    "celery[redis]>=5.4",
    "redis>=5.2",
    # Scraping
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # LLM
    "anthropic>=0.40",
    # Document parsing — ATENȚIE: dependență grea. Vezi nota din README.
    "docling>=2.0",
    # Validare JSON Schema pentru eligibility_criteria.value
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
