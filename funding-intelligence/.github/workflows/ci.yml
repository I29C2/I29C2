name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          cd funding-intelligence
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: cd funding-intelligence && ruff check .
      - name: Typecheck (mypy)
        run: cd funding-intelligence && mypy app
      - name: Tests
        run: cd funding-intelligence && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & typecheck
        run: |
          cd funding-intelligence/frontend
          npm install
          npm run typecheck
