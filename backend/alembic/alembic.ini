# backend/alembic/alembic.ini
# A generic, single database configuration.

[alembic]
# Path to migration scripts — relative to this file's directory
script_location = alembic

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Truncate revision message to this length
truncate_slug_length = 40

# Set the timezone for revision dates
timezone = UTC

# The sqlalchemy.url is set programmatically in env.py from app settings.
# The value here is a placeholder that will be overridden at runtime.
sqlalchemy.url = postgresql://betbot:betbot@localhost:5432/betbot

[post_write_hooks]
# Optionally run hooks after autogenerate writes a migration file.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
